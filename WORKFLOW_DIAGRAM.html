<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VaxTrack - System Workflow & Architecture Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 700;
    }
    p.sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.alt { background: #334155; }
    button.alt:hover { background: #475569; }
    .diagram-container {
      width: 100%;
      max-width: 1300px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      padding: 10px;
    }
    img.diagram {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }
    footer {
      max-width: 1300px;
      width: 100%;
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>VaxTrack: Vaccine Distribution & Thermal Tracking Hub</h1>
      <p class="sub">Complete System Architecture, Dataflow Pipelines & Algorithmic Modules</p>
    </div>
    <div class="btn-group">
      <button onclick="window.print()">🖨️ Print / Save as PDF</button>
      <button class="alt" onclick="window.open('WORKFLOW_DIAGRAM.svg', '_blank')">🔍 Open Vector SVG</button>
    </div>
  </header>

  <div class="diagram-container">
    <img src="WORKFLOW_DIAGRAM.svg" alt="VaxTrack System Workflow Diagram" class="diagram" />
  </div>

  <footer>
    CSE College Mini Project — Software-Only Thermodynamic Simulation, AI Time-Series Forecasting & Multi-Tier Cold Chain Hub.
  </footer>
</body>
</html>
